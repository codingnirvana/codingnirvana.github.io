<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/work/' | relative_url }}">Work</a>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
      <a href="{{ '/photography/' | relative_url }}">Photos</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>
      {% for t in site.topics %}<a href="{{ t.url | relative_url }}">{{ t.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </p>
    <p>
      <a href="https://github.com/{{ site.social.github }}">GitHub</a> ·
      <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}">LinkedIn</a> ·
      <a href="https://x.com/{{ site.social.twitter }}">X</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </footer>
</body>
</html>
